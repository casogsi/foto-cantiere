<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b4f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<title>Foto Cantiere</title>
<style>
  :root { --bg:#f4f6f5; --card:#fff; --ink:#1a2421; --muted:#667570; --brand:#0f6b4f; --brand-ink:#fff; --line:#dbe3e0; --err:#b3261e; --ok:#0f6b4f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121816; --card:#1b2421; --ink:#eaf1ee; --muted:#93a39d; --brand:#3cc79a; --brand-ink:#04281d; --line:#2c3935; --err:#ff8a80; --ok:#3cc79a; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif; padding:16px; padding-bottom:calc(16px + env(safe-area-inset-bottom)); }
  main { max-width:520px; margin:0 auto; display:flex; flex-direction:column; gap:14px; }
  h1 { font-size:22px; margin:4px 0 0; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:16px; display:flex; flex-direction:column; gap:12px; }
  label { font-weight:600; font-size:14px; }
  input[type=text] { width:100%; padding:14px; font-size:17px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  button { font:inherit; font-weight:600; border:0; border-radius:12px; padding:15px; cursor:pointer; background:var(--brand); color:var(--brand-ink); width:100%; }
  button.sec { background:transparent; color:var(--brand); border:1.5px solid var(--brand); }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .row { display:flex; gap:10px; }
  .muted { color:var(--muted); font-size:14px; }
  .hidden { display:none !important; }
  ul { list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:8px; }
  li { display:flex; align-items:center; gap:10px; font-size:14px; }
  li img { width:44px; height:44px; object-fit:cover; border-radius:8px; flex:none; }
  li .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .st { font-weight:600; flex:none; }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  #msg { font-size:14px; }
  #msg.err { color:var(--err); }
</style>
</head>
<body>
<main>
  <h1>Foto Cantiere</h1>

  <section class="card" id="loginCard">
    <p class="muted" style="margin:0">Accedi con il tuo account Google per salvare le foto su Drive.</p>
    <button id="btnLogin">Accedi con Google</button>
  </section>

  <section class="card hidden" id="mainCard">
    <div>
      <label for="cantiere">Cantiere</label>
      <input type="text" id="cantiere" list="recenti" placeholder="Es. Via Roma 12 - Impianto elettrico" autocomplete="off">
      <datalist id="recenti"></datalist>
    </div>
    <div>
      <label for="impianto">Tipologia impianto <span class="muted">(facoltativo)</span></label>
      <input type="text" id="impianto" list="tipi" placeholder="Es. Elettrico" autocomplete="off">
      <datalist id="tipi"></datalist>
    </div>
    <div class="row">
      <button class="sec" id="btnCamera">Scatta foto</button>
      <button class="sec" id="btnGallery">Galleria</button>
    </div>
    <input type="file" id="fileCamera" accept="image/*" capture="environment" class="hidden">
    <input type="file" id="fileGallery" accept="image/*" multiple class="hidden">
    <ul id="list"></ul>
    <button id="btnUpload" disabled>Carica su Drive</button>
    <div id="msg" class="muted"></div>
    <button class="sec" id="btnLogout">Esci</button>
  </section>
</main>

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
// ====== CONFIGURAZIONE ======
const CLIENT_ID = "281735115644-dnfo3tu7cq2l56m4t1606q23socs96d4.apps.googleusercontent.com";
const ROOT_FOLDER = "Foto Cantieri"; // cartella principale su Drive
// ============================

const SCOPE = "https://www.googleapis.com/auth/drive.file";
const $ = id => document.getElementById(id);
let tokenClient, accessToken = null, tokenExp = 0, queue = [];

function setMsg(t, err) { const m = $("msg"); m.textContent = t || ""; m.className = err ? "err" : "muted"; }

function initAuth() {
  if (!window.google || !google.accounts) { setTimeout(initAuth, 300); return; }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID, scope: SCOPE, callback: () => {}
  });
}
initAuth();

function getToken(prompt) {
  return new Promise((resolve, reject) => {
    if (accessToken && Date.now() < tokenExp - 60000) return resolve(accessToken);
    if (!tokenClient) return reject(new Error("Google non ancora pronto, riprova"));
    tokenClient.callback = r => {
      if (r.error) return reject(new Error(r.error));
      accessToken = r.access_token; tokenExp = Date.now() + (r.expires_in || 3600) * 1000;
      try { localStorage.setItem("fc_signed", "1"); } catch (e) {}
      resolve(accessToken);
    };
    tokenClient.error_callback = e => reject(new Error(e.type || "Accesso annullato"));
    tokenClient.requestAccessToken({ prompt: prompt || "" });
  });
}

function showMain() { $("loginCard").classList.add("hidden"); $("mainCard").classList.remove("hidden"); loadRecent(); loadTipi(); }

$("btnLogin").onclick = async () => {
  try { await getToken("consent"); showMain(); } catch (e) { alert("Accesso non riuscito: " + e.message); }
};
$("btnLogout").onclick = () => {
  if (accessToken && window.google) google.accounts.oauth2.revoke(accessToken, () => {});
  accessToken = null; tokenExp = 0;
  try { localStorage.removeItem("fc_signed"); } catch (e) {}
  $("mainCard").classList.add("hidden"); $("loginCard").classList.remove("hidden");
};
// se già autorizzato in passato, mostra subito la schermata principale (il token si rinnova al caricamento)
try { if (localStorage.getItem("fc_signed")) showMain(); } catch (e) {}

// ----- cantieri recenti -----
function loadRecent() {
  let r = []; try { r = JSON.parse(localStorage.getItem("fc_recent") || "[]"); } catch (e) {}
  $("recenti").innerHTML = r.map(n => `<option value="${n.replace(/"/g, "&quot;")}">`).join("");
  if (r[0] && !$("cantiere").value) $("cantiere").value = r[0];
}
// ----- tipologie impianto -----
const TIPI_BASE = ["Elettrico", "Idraulico", "Climatizzazione", "Antincendio", "Fotovoltaico", "Gas", "Speciali", "Altro"];
function loadTipi() {
  let r = []; try { r = JSON.parse(localStorage.getItem("fc_tipi") || "[]"); } catch (e) {}
  const all = [...new Set([...r, ...TIPI_BASE])];
  $("tipi").innerHTML = all.map(n => `<option value="${n.replace(/"/g, "&quot;")}">`).join("");
}
function saveTipo(n) {
  let r = []; try { r = JSON.parse(localStorage.getItem("fc_tipi") || "[]"); } catch (e) {}
  if (TIPI_BASE.includes(n)) return;
  r = [n, ...r.filter(x => x !== n)].slice(0, 15);
  try { localStorage.setItem("fc_tipi", JSON.stringify(r)); } catch (e) {}
}
function saveRecent(n) {
  let r = []; try { r = JSON.parse(localStorage.getItem("fc_recent") || "[]"); } catch (e) {}
  r = [n, ...r.filter(x => x !== n)].slice(0, 15);
  try { localStorage.setItem("fc_recent", JSON.stringify(r)); } catch (e) {}
}

// ----- selezione foto -----
$("btnCamera").onclick = () => $("fileCamera").click();
$("btnGallery").onclick = () => $("fileGallery").click();
function addFiles(files) {
  for (const f of files) queue.push({ file: f, status: "wait", url: URL.createObjectURL(f) });
  render();
}
$("fileCamera").onchange = e => { addFiles(e.target.files); e.target.value = ""; };
$("fileGallery").onchange = e => { addFiles(e.target.files); e.target.value = ""; };

function render() {
  $("list").innerHTML = "";
  queue.forEach(q => {
    const li = document.createElement("li");
    const label = { wait: "In attesa", up: "Invio…", ok: "✓ Caricata", err: "Errore" }[q.status];
    li.innerHTML = `<img src="${q.url}" alt=""><span class="name"></span><span class="st ${q.status === "ok" ? "ok" : q.status === "err" ? "err" : ""}">${label}</span>`;
    li.querySelector(".name").textContent = q.file.name;
    $("list").appendChild(li);
  });
  $("btnUpload").disabled = !queue.some(q => q.status === "wait" || q.status === "err");
}

// ----- Drive -----
const esc = s => s.replace(/\\/g, "\\\\").replace(/'/g, "\\'");
async function api(url, opts = {}) {
  const r = await fetch(url, { ...opts, headers: { Authorization: "Bearer " + accessToken, ...(opts.headers || {}) } });
  if (!r.ok) throw new Error("Drive " + r.status + ": " + (await r.text()).slice(0, 120));
  return r.json();
}
async function findOrCreateFolder(name, parentId) {
  const parent = parentId || "root";
  const q = `name='${esc(name)}' and mimeType='application/vnd.google-apps.folder' and '${parent}' in parents and trashed=false`;
  const res = await api("https://www.googleapis.com/drive/v3/files?fields=files(id)&q=" + encodeURIComponent(q));
  if (res.files.length) return res.files[0].id;
  const c = await api("https://www.googleapis.com/drive/v3/files?fields=id", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ name, mimeType: "application/vnd.google-apps.folder", parents: [parent] })
  });
  return c.id;
}
async function uploadFile(file, name, folderId) {
  const meta = { name, parents: [folderId] };
  const form = new FormData();
  form.append("metadata", new Blob([JSON.stringify(meta)], { type: "application/json" }));
  form.append("file", file);
  return api("https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id", { method: "POST", body: form });
}
const pad = n => String(n).padStart(2, "0");
function stamp(f) {
  const d = new Date(f.lastModified || Date.now());
  return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}`;
}

$("btnUpload").onclick = async () => {
  const cantiere = $("cantiere").value.trim().replace(/[\\/]/g, "-");
  const impianto = $("impianto").value.trim().replace(/[\\/]/g, "-");
  if (!cantiere) { setMsg("Inserisci il nome del cantiere.", true); $("cantiere").focus(); return; }
  $("btnUpload").disabled = true; setMsg("Connessione a Drive…");
  try {
    await getToken("");
    const rootId = await findOrCreateFolder(ROOT_FOLDER);
    let folderId = await findOrCreateFolder(cantiere, rootId);
    if (impianto) { folderId = await findOrCreateFolder(impianto, folderId); saveTipo(impianto); }
    saveRecent(cantiere);
    const percorso = `${ROOT_FOLDER}/${cantiere}${impianto ? "/" + impianto : ""}`;
    let n = 0;
    for (const q of queue) {
      if (q.status === "ok") continue;
      q.status = "up"; render(); setMsg("Carico…");
      try {
        const ext = (q.file.name.split(".").pop() || "jpg").toLowerCase();
        n++;
        await uploadFile(q.file, `${cantiere}${impianto ? "_" + impianto : ""}_${stamp(q.file)}_${n}.${ext}`, folderId);
        q.status = "ok";
      } catch (e) { q.status = "err"; console.error(e); }
      render();
    }
    const ko = queue.filter(q => q.status === "err").length;
    setMsg(ko ? `${ko} foto non caricate. Premi di nuovo "Carica".` : `Fatto! Foto salvate in ${percorso}`, !!ko);
    if (!ko) setTimeout(() => { queue = []; render(); }, 2500);
  } catch (e) {
    setMsg("Errore: " + e.message, true);
  }
  render();
};

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
